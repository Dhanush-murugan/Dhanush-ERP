<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="dsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#15172b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Neon Border Gradient -->
    <linearGradient id="dsBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Bow Primary Gradient (Dhanush Arc) -->
    <linearGradient id="dsBowGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Arrow / Velocity Golden Gradient -->
    <linearGradient id="dsArrowGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Wing / Ribbon Gradient (S Flow) -->
    <linearGradient id="dsFlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="dsCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dsSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Drop Shadow -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#dsBgGrad)" stroke="url(#dsBorderGrad)" stroke-width="2.5" filter="url(#dsSoftShadow)" />

  <!-- Inner Ambient Glow Mesh -->
  <circle cx="60" cy="60" r="38" fill="url(#dsBowGrad)" fill-opacity="0.08" filter="url(#dsCoreGlow)" />
  <circle cx="78" cy="48" r="22" fill="#06b6d4" fill-opacity="0.12" filter="url(#dsCoreGlow)" />

  <!-- Futuristic Dhanush (Bow) Tension Arc - forming outer 'D' curve -->
  <path
    d="M 60 22 C 34 22 22 40 22 60 C 22 80 34 98 60 98"
    fill="none"
    stroke="url(#dsBowGrad)"
    stroke-width="6"
    stroke-linecap="round"
    filter="url(#dsCoreGlow)"
  />

  <!-- High-Precision Bow String Line with subtle opacity -->
  <line x1="60" y1="22" x2="60" y2="98" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- The Forward Velocity Arrow & Quantum 'S' Loop -->
  <path
    d="M 52 34 C 68 34 82 40 82 50 C 82 58 72 62 60 62 C 48 62 38 66 38 74 C 38 84 52 86 68 86"
    fill="none"
    stroke="url(#dsFlowGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Golden Arrow Head & Central Delta -->
  <path
    d="M 44 60 L 76 60 M 76 60 L 64 52 M 76 60 L 64 68"
    fill="none"
    stroke="url(#dsArrowGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#dsCoreGlow)"
  />

  <!-- Arrow Core Diamond Tip -->
  <polygon points="84,60 76,56 74,60 76,64" fill="#fbbf24" />

  <!-- Connected Quantum Nodes -->
  <circle cx="60" cy="22" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="60" cy="98" r="4.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="82" cy="50" r="3.5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1" />
  <circle cx="38" cy="74" r="3.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1" />

  <!-- Central Pulse Nucleus -->
  <circle cx="60" cy="60" r="4" fill="#ffffff" filter="url(#dsCoreGlow)" />
  <circle cx="60" cy="60" r="2" fill="#0b0f19" />
</svg>